services:
  core-api:
    build: ./fintech-core-api
    ports:
      - "8080:8080"
    environment:
      - SUPABASE_URL=https://dsopgsosyhbhljitzntl.supabase.co
      - SUPABASE_ANON_KEY=sb_publishable_B2NrgspOgr-RWh1QppC-4w_-6flBAjx
      - AWS_REGION=us-east-1

  core-api-python:
    build: ./core-api
    ports:
      - "8081:8080"
    env_file:
      - core-api/.env
    volumes:
      - ./core-api/app:/app/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    profiles:
      - python

  ui-dashboard:
    build:
      context: ./ui-dashboard
      target: build
    ports:
      - "3000:3000"
    env_file:
      - ui-dashboard/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_PORT=0
    volumes:
      - ./ui-dashboard/src:/app/src
      - ./ui-dashboard/public:/app/public
    command: npm start
    depends_on:
      - core-api